name: wf-develop-validate-pr
on:
   pull_request:
   branches:
    -develop
jobs:
 develop-pr-job:
  runs-on: ubuntu-latest
steps:
 - name: checkout repo 
   uses: actions/checkout@v4
 -name: Lint html and Css files
   run: |
     npx htmlhint "**/*.html"
     npx styllint "**/*.css"
  -name: Build website
     run: |
       npx parcel build "./src/index.html" --dist-dir "./dist" -public-url "./"