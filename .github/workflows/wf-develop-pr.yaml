name: wf-develop-pr
on:
  pull-request:
    branches:
      - devlop
jobs:
  develop-pr-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: lint HTNL and CSS Files 
        run: 
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: Build Website
        run: 
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      